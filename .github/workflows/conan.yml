name: conan-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build recipe
    runs-on: ubuntu-latest
    env:
      CONAN_REMOTE_NAME: untwine
      CONAN_REMOTE_URL: https://conan.cloudsmith.io/untwine/conan/
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Conan
        shell: bash
        run: |
          pip install conan
          conan profile detect
          conan remote add "$CONAN_REMOTE_NAME" "$CONAN_REMOTE_URL" --force

      - name: Create package
        shell: bash
        run: conan create . --build=missing

      - name: Save package
        shell: bash
        run: conan cache save "pxr-pegtl/*:*" --file=package.tgz

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: conan-package
          path: package.tgz

  upload:
    name: Review and upload
    needs: build
    environment: release
    runs-on: ubuntu-latest
    env:
      CONAN_REMOTE_NAME: untwine
      CONAN_REMOTE_URL: https://conan.cloudsmith.io/untwine/conan/
      CONAN_LOGIN_USERNAME: jeremy-retailleau

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Conan
        shell: bash
        run: |
          pip install conan
          conan profile detect
          conan remote add "$CONAN_REMOTE_NAME" "$CONAN_REMOTE_URL" --force

      - uses: actions/download-artifact@v7
        with:
          name: conan-package
          path: packages

      - name: Restore package into cache
        shell: bash
        run: conan cache restore packages/package.tgz

      - name: Authenticate to package repository
        shell: bash
        env:
          CONAN_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: conan remote login "$CONAN_REMOTE_NAME" "$CONAN_LOGIN_USERNAME" -p "$CONAN_API_KEY"

      - name: Upload package
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if conan upload "pxr-pegtl/*" -r "$CONAN_REMOTE_NAME" -c; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          exit 1
