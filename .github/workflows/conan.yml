name: conan-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_upload:
    name: Build and upload
    runs-on: ubuntu-latest
    env:
      CONAN_REMOTE_NAME: untwine
      CONAN_REMOTE_URL: https://packages.untwine-openusd.dev/repository/conan/

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Conan
        shell: bash
        run: |
          pip install conan
          conan profile detect
          conan remote add "$CONAN_REMOTE_NAME" "$CONAN_REMOTE_URL" --force

      - name: Create package
        run: conan create . --build=missing

      - name: Authenticate to package repository
        shell: bash
        env:
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: conan remote login "$CONAN_REMOTE_NAME" github-actions -p "$NEXUS_PASSWORD"

      - name: Upload package
        shell: bash
        run: conan upload "pxr-pegtl/*" -r "$CONAN_REMOTE_NAME" -c
